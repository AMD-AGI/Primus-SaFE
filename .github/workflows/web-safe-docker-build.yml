name: Build and Push Safe Docker Image

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
    paths:
      - 'Web/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tags
        id: tag
        env:
          PUSH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          LATEST: ${{ github.ref == 'refs/heads/main' }}
        run: |
          TAG=$(date -u +'%Y%m%d%H%M')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "push=${PUSH}" >> $GITHUB_OUTPUT
          {
            echo "tags<<EOF"
            echo "docker.io/primussafe/primus-safe-web:${TAG}"
            echo "quay.io/primussafe/primus-safe-web:${TAG}"
            if [ "${LATEST}" = "true" ]; then
              echo "docker.io/primussafe/primus-safe-web:latest"
              echo "quay.io/primussafe/primus-safe-web:latest"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG} (push=${PUSH}, latest=${LATEST})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.tag.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Quay.io
        if: steps.tag.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Web
          file: ./Web/Dockerfile
          # Only main and release tags publish; other branches build to check the image.
          push: ${{ steps.tag.outputs.push == 'true' }}
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        if: steps.tag.outputs.push == 'true'
        run: |
          echo "Image pushed to Docker Hub and Quay.io"
          echo "Docker Hub: docker.io/primussafe/primus-safe-web:${{ steps.tag.outputs.tag }}"
          echo "Quay.io: quay.io/primussafe/primus-safe-web:${{ steps.tag.outputs.tag }}"
