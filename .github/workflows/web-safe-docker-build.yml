name: Build and Push Safe Docker Image

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
    paths:
      - 'Web/**'
      - '.github/workflows/web-safe-docker-build.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tags
        id: tag
        env:
          # Dated tags are published from every branch. latest stays on main.
          LATEST: ${{ github.ref == 'refs/heads/main' }}
        run: |
          TAG=$(date -u +'%Y%m%d%H%M')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "latest=${LATEST}" >> $GITHUB_OUTPUT
          {
            echo "tags<<EOF"
            echo "docker.io/primussafe/primus-safe-web:${TAG}"
            echo "quay.io/primussafe/primus-safe-web:${TAG}"
            if [ "${LATEST}" = "true" ]; then
              echo "docker.io/primussafe/primus-safe-web:latest"
              echo "quay.io/primussafe/primus-safe-web:latest"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG} (latest=${LATEST})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Web
          file: ./Web/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          # The console calls sso-mcp on its own host, so each host must route /sso-mcp/ to it.
          build-args: |
            VITE_MCP_BASE_URL=/sso-mcp/mcp
            VITE_MCP_API_KEY=${{ secrets.VITE_MCP_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          {
            echo "### Web image"
            echo ""
            echo "- \`docker.io/primussafe/primus-safe-web:${TAG}\`"
            echo "- \`quay.io/primussafe/primus-safe-web:${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Image pushed to Docker Hub and Quay.io"
          echo "Docker Hub: docker.io/primussafe/primus-safe-web:${TAG}"
          echo "Quay.io: quay.io/primussafe/primus-safe-web:${TAG}"
          if [ "${{ steps.tag.outputs.latest }}" = "true" ]; then
            echo "Also tagged latest on Docker Hub and Quay.io"
          fi
