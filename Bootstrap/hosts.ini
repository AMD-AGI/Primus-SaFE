# Ansible inventory that bootstrap.sh passes to Kubespray.
# Replace the example names and addresses with your own nodes.
# - Kubespray renames each host to its inventory name.
# - ansible_host is the address Ansible connects to; ip is the address
#   Kubernetes binds to on that node.
# - Node IPs must not overlap KUBE_PODS_SUBNET (172.16.0.0/12) or
#   KUBE_SERVICE_ADDRESSES (192.168.0.0/16). If they do, change those
#   variables in bootstrap.sh.

[all]
node-01 ansible_host=10.0.0.11 ip=10.0.0.11
node-02 ansible_host=10.0.0.12 ip=10.0.0.12
node-03 ansible_host=10.0.0.13 ip=10.0.0.13

# To log in as a non-root user with passwordless sudo, uncomment and edit.
# bootstrap.sh already passes --become --become-user=root, so do not set
# ansible_become here: inventory variables override Kubespray's per-task
# "become: false".
# [all:vars]
# ansible_user=<user>
# ansible_ssh_private_key_file=~/.ssh/id_ed25519

[kube_control_plane]
node-01
node-02
node-03

[etcd]
node-01
node-02
node-03

[kube_node]
node-01
node-02
node-03

[k8s_cluster:children]
kube_control_plane
kube_node
