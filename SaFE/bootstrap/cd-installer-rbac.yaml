# Rights of the account that runs a console deployment (an OpsJob of type cd runs
# bootstrap/cd-deploy.sh as ServiceAccount default/primus-safe). It covers what upgrade.sh does for an
# installed release: replace the CRDs, the chart's ClusterRoles (templates/rbac/role.yaml) and webhook
# configurations, then helm upgrade primus-safe (hooks included) and primus-safe-cr.
#
# Apply it once with an administrator kubeconfig, instead of binding cluster-admin:
#   kubectl apply -f SaFE/bootstrap/cd-installer-rbac.yaml
#
# Adjust it when your install differs from the chart defaults:
# - the release namespace is primus-safe;
# - cicd.role_name is gha-rs-manager and monarch.client_role is monarch-client;
# - copy-opensearch-secret reads from the release namespace. When opensearch.secret_namespace is
#   another namespace, also grant this account there: get on that secret, and get/create/delete on
#   roles and rolebindings (the hook Role secret-manager in that namespace).
# Enabling cicd or monarch on a running install creates a new ClusterRole; run that upgrade as an
# administrator once. The first upgrade that adds ClusterRole primus-safe-resource-manager, its
# bindings, and ValidatingAdmissionPolicy primus-safe-rbac-projection also needs an administrator:
# this account can update and bind those objects by name, and cannot create them. Deploying a chart
# from before the namespaced secret-manager hook (it created a ClusterRole with every secret) also
# needs an administrator.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: primus-safe
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: primus-safe-cd-installer
  labels:
    app.kubernetes.io/part-of: primus-safe-cd
rules:
  # kubectl replace -f crds/; create is the fallback for a CRD that does not exist yet.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "update", "patch"]
    resourceNames:
      - addons.amd.com
      - addontemplates.amd.com
      - clusters.amd.com
      - faults.amd.com
      - models.amd.com
      - nodeflavors.amd.com
      - nodes.amd.com
      - nodetemplates.amd.com
      - opsjobs.amd.com
      - resourcetemplates.amd.com
      - roles.amd.com
      - users.amd.com
      - workloads.amd.com
      - workspaces.amd.com
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["primus-safe-webhook-mutate", "primus-safe-webhook-validate"]
  # The chart's ClusterRoles grant rights this account does not hold, so updating them needs escalate.
  # Kubernetes checks escalate against the role's name on update, so it stays limited to these.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["get", "update", "patch", "escalate"]
    resourceNames: ["primus-safe", "primus-safe-resource-manager", "gha-rs-manager", "github-runner", "monarch-client"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["primus-safe", "primus-safe-resource-manager", "primus-safe-resource-manager-shared"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["primus-safe", "primus-safe-resource-manager"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["primus-safe-rbac-projection"]
  # primus-safe-cr (cluster-scoped SaFE resources) and the reads of cd-deploy.sh.
  - apiGroups: ["amd.com"]
    resources: ["addontemplates", "nodeflavors", "nodetemplates", "resourcetemplates", "roles", "users"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["amd.com"]
    resources: ["clusters", "workloads"]
    verbs: ["get", "list"]
---
# Everything the primus-safe release owns in its namespace, helm's release secrets included.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: primus-safe-cd-installer
  namespace: primus-safe
  labels:
    app.kubernetes.io/part-of: primus-safe-cd
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # The pre-install/pre-upgrade hook Role and RoleBinding secret-manager. This account holds every
  # right that Role grants, so it may create and bind it without escalate or bind.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["tcproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["grafana.integreatly.org"]
    resources: ["grafanas", "grafanadashboards", "grafanadatasources"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["postgres-operator.crunchydata.com"]
    resources: ["postgresclusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: primus-safe-cd-installer
  labels:
    app.kubernetes.io/part-of: primus-safe-cd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: primus-safe-cd-installer
subjects:
  - kind: ServiceAccount
    name: primus-safe
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: primus-safe-cd-installer
  namespace: primus-safe
  labels:
    app.kubernetes.io/part-of: primus-safe-cd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: primus-safe-cd-installer
subjects:
  - kind: ServiceAccount
    name: primus-safe
    namespace: default
