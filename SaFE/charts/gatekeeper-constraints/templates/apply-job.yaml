# The account applies constraint manifests and is also used by the delete hook.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gatekeeper-constraint-apply
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gatekeeper-constraint-apply
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - sandboxworkloadattestation.constraints.gatekeeper.sh
    verbs: ["get"]
  - apiGroups: ["constraints.gatekeeper.sh"]
    resources: ["sandboxworkloadattestation"]
    verbs: ["create"]
  - apiGroups: ["constraints.gatekeeper.sh"]
    resources: ["sandboxworkloadattestation"]
    resourceNames: ["sandbox-workload-attestation"]
    verbs: ["get", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gatekeeper-constraint-apply
subjects:
  - kind: ServiceAccount
    name: gatekeeper-constraint-apply
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gatekeeper-constraint-apply
---
# Applies the constraints once their CRDs serve the parameters of this chart. The
# ConstraintTemplates and Config are release resources. This is a release Job,
# so an upgrade that does not run Helm hooks still creates it. The name includes
# the chart version because a finished Job cannot be updated in place.
apiVersion: batch/v1
kind: Job
metadata:
  name: gatekeeper-constraint-apply-{{ .Chart.Version | replace "." "-" }}
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: gatekeeper-constraint-apply
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: apply
          image: "{{ include "constraints.curlRepository" . }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: RELEASE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              api=https://kubernetes.default.svc
              wait_crd() {
                name="$1"
                field="$2"
                i=0
                while [ "$i" -lt 60 ]; do
                  if curl -fsS --cacert "$ca" -H "Authorization: Bearer ${token}" \
                    "${api}/apis/apiextensions.k8s.io/v1/customresourcedefinitions/${name}" -o /tmp/crd &&
                    grep -q "\"${field}\"" /tmp/crd; then
                    return 0
                  fi
                  i=$((i + 1))
                  sleep 2
                done
                echo "timed out waiting for ${name}" >&2
                return 1
              }
              apply() {
                url="$1"
                name="$2"
                body="$3"
                spec="$4"
                code="$(curl -sS -o /tmp/resp -w '%{http_code}' --cacert "$ca" \
                  -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" \
                  -X POST "${url}" --data-binary "@${body}")"
                if [ "$code" = "200" ] || [ "$code" = "201" ]; then
                  return 0
                fi
                if [ "$code" = "409" ]; then
                  code="$(curl -sS -o /tmp/resp -w '%{http_code}' --cacert "$ca" \
                    -H "Authorization: Bearer ${token}" -H "Content-Type: application/merge-patch+json" \
                    -X PATCH "${url}/${name}" --data-binary "@${spec}")"
                  if [ "$code" = "200" ]; then
                    return 0
                  fi
                fi
                echo "apply ${name} failed: ${code}" >&2
                cat /tmp/resp >&2
                return 1
              }
              wait_crd sandboxworkloadattestation.constraints.gatekeeper.sh identity
              apply "${api}/apis/constraints.gatekeeper.sh/v1beta1/sandboxworkloadattestation" sandbox-workload-attestation /manifests/sandbox-workload-attestation.json /manifests/sandbox-workload-attestation.spec.json
          volumeMounts:
            - name: manifests
              mountPath: /manifests
              readOnly: true
      volumes:
        - name: manifests
          configMap:
            name: gatekeeper-constraint-manifests
