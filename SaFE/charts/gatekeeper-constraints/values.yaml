# deny rejects Workloads that fail a constraint. jwks, identity.jwks, identity.issuer, and identity.actor are required.
enforcementAction: deny

# Calls from this account are checked. The Gatekeeper webhook is scoped to it.
sandboxCreator: system:serviceaccount:agent-sandbox-system:agent-sandbox-controlplane

# Claw JWKS document, JSON text. Required when enforcementAction is deny.
jwks: ""

# Identity provider assertion. jwks is the provider JWKS document, JSON text; issuer is its iss. actor is the
# control plane client id, the act.sub of the assertion. audience, tokenType, and detailType are the aud, the typ
# header, and the authorization_details type the control plane asks for.
identity:
  jwks: ""
  issuer: ""
  actor: ""
  audience: agent-sandbox-admission
  tokenType: assertion+jwt
  detailType: agent-sandbox-workload

image:
  repository: curlimages/curl
  tag: "8.20.0"
  pullPolicy: IfNotPresent

# Hook Job security settings. They satisfy the restricted Pod Security level of the Gatekeeper namespace.
# The UID matches the curl_user account of the curl image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
