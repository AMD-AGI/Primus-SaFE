# dryrun records violations. deny rejects them and requires jwks.
enforcementAction: dryrun

# Calls from this account are checked. The Gatekeeper webhook is scoped to it.
sandboxCreator: system:serviceaccount:agent-sandbox-system:agent-sandbox-controlplane

# Claw JWKS document, JSON text. Required when enforcementAction is deny.
jwks: ""

# Identity-key Sandboxes carry no grant attestation. When allow is set, a Workload
# labelled agent-sandbox.io/owner-key is accepted if its grant id is the owner
# record of its user, its kind is Sandbox, and it requests at most
# maxGpusPerSandbox GPUs. Workspace membership is still checked.
ownerKeys:
  allow: false
  maxGpusPerSandbox: 8

image:
  repository: curlimages/curl
  tag: "8.20.0"
  pullPolicy: IfNotPresent
