#
# Membership, grant-attestation, and primus-identity attestation constraints.
# Install this Addon on the management cluster after gatekeeper.3.23.1.
# It is not a default addon.
#
# Notes:
#   1. Package SaFE/charts/gatekeeper-constraints and push it before applying:
#        oci://<helm registry host>/primussafe/gatekeeper-constraints:0.1.2
#      A helm_registry value ending in /proxy names the cache project, so the host is used.
#      The apply Job uses <proxy_image_registry>/primussafe/curl:8.20.0.
#   2. enforcementAction is deny. Set jwks, identityJwks, and identityIssuer when installing the Addon.
#   3. User membership reads spec.resources.workspaces on the synced User CR. A system-admin User
#      is a member of every workspace.
#

apiVersion: amd.com/v1
kind: AddonTemplate
metadata:
  labels:
    primus-safe.display.name: "gatekeeper-constraints.0.1.2"
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  name: gatekeeper-constraints.0.1.2
spec:
  category: plugin
  description: Gatekeeper constraints that check Agent Sandbox Workload membership, the Claw grant attestation, and the primus-identity attestation. Install on the management cluster after Gatekeeper. Enforcement is deny.
  url: oci://{{ .Values.global.helm_registry | trimSuffix "/proxy" }}/primussafe/gatekeeper-constraints
  version: 0.1.2
  type: helm
  required: false
  helmDefaultNamespace: gatekeeper-system
  helmDefaultValues: |
    enforcementAction: deny
    sandboxCreator: system:serviceaccount:agent-sandbox-system:agent-sandbox-controlplane
    jwks: ""
    identityJwks: ""
    identityIssuer: ""
    image:
      repository: {{ .Values.global.proxy_image_registry }}/primussafe/curl
      tag: "8.20.0"
      pullPolicy: IfNotPresent
