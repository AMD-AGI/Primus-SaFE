#
# OPA Gatekeeper for admission checks on Workloads created by Agent Sandbox.
# primus-safe-cr installs this chart on the management cluster. This template
# is not a default addon, so data-plane clusters do not run the webhook.
#
# Notes:
#   1. Upstream chart 3.23.1 from oci://ghcr.io/open-policy-agent/charts/gatekeeper.
#      Mirror before applying:
#        oci://<helm_registry>/primussafe/gatekeeper:3.23.1
#        <proxy_image_registry>/primussafe/gatekeeper:v3.23.1
#        <proxy_image_registry>/primussafe/gatekeeper-crds:v3.23.1
#        <proxy_image_registry>/primussafe/curl:8.20.0
#   2. The validating webhook admits amd.com/v1 Workload CREATE from
#      system:serviceaccount:agent-sandbox-system:agent-sandbox-controlplane.
#      Other creators are not sent to Gatekeeper. Constraints are the
#      gatekeeper-constraints addon, installed after this one.
#   3. failurePolicy is Fail. If the webhook is unreachable, only that
#      service account's Workload creates are rejected.
#   4. Two controller replicas. Mutation is disabled.
#

apiVersion: amd.com/v1
kind: AddonTemplate
metadata:
  labels:
    primus-safe.display.name: "gatekeeper.3.23.1"
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  name: gatekeeper.3.23.1
spec:
  category: plugin
  description: OPA Gatekeeper admission controller. Install on the management cluster only. The validating webhook receives Workload creates from the Agent Sandbox control plane.
  url: oci://{{ .Values.global.helm_registry }}/primussafe/gatekeeper
  version: 3.23.1
  type: helm
  required: false
  helmDefaultNamespace: gatekeeper-system
  helmDefaultValues: |
    replicas: 2
    disableMutation: true
    validatingWebhookFailurePolicy: Fail
    validatingWebhookTimeoutSeconds: 10
    validatingWebhookMatchConditions:
      - name: agent-sandbox-controlplane
        expression: request.userInfo.username == 'system:serviceaccount:agent-sandbox-system:agent-sandbox-controlplane'
    validatingWebhookCustomRules:
      - apiGroups: ["amd.com"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["workloads"]
        scope: "Cluster"
    image:
      repository: {{ .Values.global.proxy_image_registry }}/primussafe/gatekeeper
      crdRepository: {{ .Values.global.proxy_image_registry }}/primussafe/gatekeeper-crds
      release: v3.23.1
      pullPolicy: IfNotPresent
    preInstall:
      crdRepository:
        image:
          repository: {{ .Values.global.proxy_image_registry }}/primussafe/gatekeeper-crds
          tag: v3.23.1
    postInstall:
      labelNamespace:
        image:
          repository: {{ .Values.global.proxy_image_registry }}/primussafe/gatekeeper-crds
          tag: v3.23.1
      probeWebhook:
        image:
          repository: {{ .Values.global.proxy_image_registry }}/primussafe/curl
          tag: "8.20.0"
    postUpgrade:
      labelNamespace:
        image:
          repository: {{ .Values.global.proxy_image_registry }}/primussafe/gatekeeper-crds
          tag: v3.23.1
