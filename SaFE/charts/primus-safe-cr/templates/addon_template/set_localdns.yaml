{{- $systemHost := printf "%s.%s" .Values.global.sub_domain .Values.global.domain }}
apiVersion: amd.com/v1
kind: AddonTemplate
metadata:
  name: set-localdns
  labels:
    primus-safe.display.name: "set-localdns"
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  required: true
  description: Configure systemd-networkd to route the control-plane domain DNS queries through nodelocaldns.
  action: {{ printf "CONF_PATH=\"/etc/systemd/network/99-nodelocaldns.network\"\nEXPECTED_DOMAIN=\"~%s\"\n\nif [ -f \"$CONF_PATH\" ] && grep -q '^Domains=' \"$CONF_PATH\"; then\n  for domain in $(grep '^Domains=' \"$CONF_PATH\" | sed 's/^Domains=//'); do\n    if [ \"$domain\" = \"$EXPECTED_DOMAIN\" ]; then\n      exit 0\n    fi\n  done\n  sed -i \"0,/^Domains=/s|^Domains=\\(.*\\)|Domains=\\1 $EXPECTED_DOMAIN|\" \"$CONF_PATH\"\nelse\n  cat > \"$CONF_PATH\" << EOF\n[Match]\nName=nodelocaldns\n\n[Link]\nRequiredForOnline=no\nActivationPolicy=always-up\n\n[Network]\nConfigureWithoutCarrier=yes\nKeepConfiguration=yes\nDNS=169.254.25.10\nDomains=$EXPECTED_DOMAIN\nDNSDefaultRoute=false\nEOF\nfi\n\nip link set nodelocaldns up\nnetworkctl reload\nexit $?\n" $systemHost | b64enc }}
