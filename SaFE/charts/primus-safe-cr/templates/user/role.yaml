apiVersion: amd.com/v1
kind: Role
metadata:
  name: system-admin
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
rules:
- resources:
    - "*"
  grantedUsers:
    - "*"
  verbs:
    - "*"
---
apiVersion: amd.com/v1
kind: Role
metadata:
  name: system-admin-readonly
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
rules:
  - resources:
      - "*"
    grantedUsers:
      - "*"
    verbs:
      - get
      - list
---
apiVersion: amd.com/v1
kind: Role
metadata:
  name: default
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
rules:
- resources:
    - workload
    - workload/low-priority
    - workload/med-priority
    - user
    - secret
    - opsjob
    - opsjob/preflight
    - opsjob/download
    - opsjob/dumplog
  grantedUsers:
    - owner
  verbs:
    - get
    - list
    - update
    - delete
    - resume
- resources:
    - workload
    - workload/low-priority
    - workload/med-priority
  grantedUsers:
    - workspace-user
  verbs:
    - create
    - get
    - list
# Members read the nodes of their workspaces and change none of them. Changing a node (taints,
# labels, flavor, address, provisioning retry, delete) takes a role that grants it on every node,
# which among these roles is system-admin; the apiserver does not match a rule granted to
# workspace members for it.
- resources:
    - node
    - workspace
    - user
    - opsjob/preflight
    - opsjob/download
    - opsjob/dumplog
  grantedUsers:
    - workspace-user
  verbs:
    - get
    - list
- resources:
    - cluster
    - nodeflavor
    - nodetemplate
    - imageregister
  grantedUsers:
    - "*"
  verbs:
    - get
    - list
# Cluster addons and their templates: the apiserver checks these reads like every other, so the
# default role holds them explicitly (every user could read them before the check existed).
- resources:
    - addon
    - addontemplate
  grantedUsers:
    - "*"
  verbs:
    - get
    - list
# Playground models: owners manage their own models; workspace members can
# create models in their workspace. Creating a public model (empty workspace)
# is not granted here, so it falls to system administrators only.
- resources:
    - model
  grantedUsers:
    - owner
  verbs:
    - get
    - list
    - update
    - delete
- resources:
    - model
  grantedUsers:
    - workspace-user
  verbs:
    - create
    - get
    - list
- resources:
    - publickey
    - imageimport
  grantedUsers:
    - "*"
  verbs:
    - "*"
- resources:
    - apikeys
  grantedUsers:
    - owner
  verbs:
    - create
    - list
    - delete
# A preflight job runs privileged on its nodes, so creating one also takes workload/privileged in
# the workspace (workspace-admin), which this role does not grant.
- resources:
    - secret
    - opsjob/preflight
    - opsjob/download
    - opsjob/dumplog
  grantedUsers:
    - workspace-user
  verbs:
    - create
---
apiVersion: amd.com/v1
kind: Role
metadata:
  name: workspace-admin
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
rules:
- resources:
    - workload
    - workspace
    - workload/high-priority
    - workload/med-priority
    - workload/low-priority
    - workload/privileged
    - addontemplate
  grantedUsers:
    - workspace-user
  verbs:
    - "*"
- resources:
    - user/workspace
  grantedUsers:
    - workspace-user
  verbs:
    - update
- resources:
    - user
  grantedUsers:
    - "*"
  verbs:
    - list
- resources:
    - secret
  grantedUsers:
    - workspace-user
  verbs:
    - list
---
apiVersion: amd.com/v1
kind: Role
metadata:
  name: self-read
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
# The role of a user who holds no access yet (primus-safe users.base_roles: [self-read]): the
# user's own user record, to read, and nothing else. No list, no write, no workspace, no other
# resource. An administrator grants more by adding the default role and workspaces to the user.
rules:
- resources:
    - user
  grantedUsers:
    - owner
  verbs:
    - get
