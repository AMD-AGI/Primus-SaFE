#
# With auth.client_secret and auth.identity_service_account set, the chart creates that Secret empty
# and the identity service's account may read and update it, so it can write the client credentials
# of its SERVICE_CLIENTS entry for this apiserver. A Secret of that name that this release does not
# own (created before the chart did) is left to its owner. The Secret is kept on uninstall.
{{- $secret := default "" .Values.auth.client_secret }}
{{- $sa := default "" .Values.auth.identity_service_account }}
{{- if and $secret $sa }}
{{- $parts := splitList "/" $sa }}
{{- if or (ne (len $parts) 2) (not (index $parts 0)) (not (index $parts 1)) }}
{{- fail "auth.identity_service_account must be <namespace>/<name>" }}
{{- end }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secret }}
{{- $owner := "" }}
{{- if $existing }}
{{- $owner = dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existing }}
{{- end }}
{{- if or (not $existing) (eq $owner .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-identity-client
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secret | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-identity-client
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-identity-client
subjects:
  - kind: ServiceAccount
    name: {{ index $parts 1 | quote }}
    namespace: {{ index $parts 0 | quote }}
{{- end }}
