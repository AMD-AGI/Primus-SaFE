apiVersion: v1
kind: ConfigMap
metadata:
  name: github-hosted-runner-template
  namespace: {{ .Release.Namespace }}
  labels:
    primus-safe.workload.version: v1
    primus-safe.workload.kind: GithubRunner
    app.kubernetes.io/managed-by: Helm
  annotations:
    # The main container name should match the configuration defined in the template below
    primus-safe.main.container: runner
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
data:
 template: |
  apiVersion: apps/v1
  kind: StatefulSet
  spec:
    podManagementPolicy: Parallel
    template:
      spec:
        dnsPolicy: ClusterFirstWithHostNet
        serviceAccountName: github-runner
{{- if (default "" (default .Values.cicd).proxy_relay_image) }}
        initContainers:
        - name: proxy-relay
          image: {{ .Values.cicd.proxy_relay_image }}
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              : "${PROXY_UPSTREAM_HOST:?}" "${PROXY_UPSTREAM_PORT:?}"
              percent_encode() {
                LC_ALL=C od -A n -v -t x1 | tr -d '[:space:]' | sed 's/../%&/g'
              }
              login=""
              if [ -s /etc/secrets/proxy/username ] && [ -s /etc/secrets/proxy/password ]; then
                username=$(percent_encode </etc/secrets/proxy/username)
                pw=$(percent_encode </etc/secrets/proxy/password)
                login=" login=${username}:${pw}"
              fi
              cat >/tmp/squid.conf <<EOF
              http_port ${PROXY_RELAY_PORT}
              acl loopback src 127.0.0.1/32 ::1
              acl CONNECT method CONNECT
              http_access allow loopback
              http_access deny all
              cache_peer ${PROXY_UPSTREAM_HOST} parent ${PROXY_UPSTREAM_PORT} 0 no-query default${login} name=upstream
              EOF
              case "${PROXY_UPSTREAM_DOMAINS:-}" in
                *[!A-Za-z0-9.*_\ -]*)
                  echo "PROXY_UPSTREAM_DOMAINS: expected domain patterns separated by spaces" >&2
                  exit 1
                  ;;
              esac
              if [ -n "${PROXY_UPSTREAM_DOMAINS:-}" ]; then
                cat >>/tmp/squid.conf <<EOF
              acl upstream_domains dstdomain ${PROXY_UPSTREAM_DOMAINS}
              cache_peer_access upstream allow upstream_domains
              cache_peer_access upstream deny all
              never_direct allow upstream_domains
              always_direct deny upstream_domains
              always_direct allow all
              EOF
              else
                echo "relay: PROXY_UPSTREAM_DOMAINS is empty; ALL egress goes through" \
                  "${PROXY_UPSTREAM_HOST}:${PROXY_UPSTREAM_PORT} with no direct fallback" >&2
                cat >>/tmp/squid.conf <<EOF
              never_direct allow all
              EOF
              fi
              cat >>/tmp/squid.conf <<EOF
              cache deny all
              access_log none
              cache_log stdio:/var/log/squid/cache.log
              pid_filename none
              EOF
              exec squid -N -f /tmp/squid.conf
          env:
            - name: PROXY_RELAY_PORT
              value: "{{ default 3129 (default .Values.cicd).proxy_relay_port }}"
            - name: PROXY_UPSTREAM_DOMAINS
              value: "{{ if kindIs "invalid" (default .Values.cicd).proxy_relay_upstream_domains }}.github.com .githubusercontent.com .ghcr.io{{ else }}{{ (default .Values.cicd).proxy_relay_upstream_domains }}{{ end }}"
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: proxy-credential
              mountPath: /etc/secrets/proxy
              readOnly: true
{{- end }}
        containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:latest
          imagePullPolicy: Always
          env:
            - name: RUNNER_ALLOW_RUNASROOT
              value: "1"
            - name: ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT
              value: "1"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            runAsUser: 0
            privileged: true
          # Dispatcher injects preStop (config.sh remove) for scale-down and
          # workload delete. Rolling restarts keep the ordinal and skip remove.
        terminationGracePeriodSeconds: 60
        restartPolicy: Always
        schedulerName: kube-scheduler-plugins
{{- if (default "" (default .Values.cicd).proxy_relay_image) }}
        volumes:
        - name: proxy-credential
          secret:
            optional: true
            items:
            - key: username
              path: username
            - key: password
              path: password
{{- end }}
