{{- $pt := default dict .Values.post_training }}
{{- if $pt.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: post-training-registry
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
data:
  registry.yaml: |
{{ toYaml (default dict $pt.registry) | indent 4 }}
{{- end }}
