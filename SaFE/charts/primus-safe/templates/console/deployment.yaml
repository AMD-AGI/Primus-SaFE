apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    primus-safe-app-name: web
    app.kubernetes.io/managed-by: Helm
    app: {{ .Release.Name }}-web
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ .Release.Name }}-web
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: feature.node.kubernetes.io/amd-gpu
                    operator: NotIn
                    values:
                      - "true"
      {{- with include "primus-safe.managementPlacement" . }}
      {{- . | trim | nindent 6 }}
      {{- end }}
      containers:
        - name: app
          image: {{ .Values.global.image_registry }}/primussafe/{{ .Values.web.image }}
          ports:
            - containerPort: 80
          {{- $auth := default dict .Values.auth }}
          {{- $apiKeysUpstream := and (eq (toString $auth.mode) "external") $auth.api_keys_upstream }}
          {{- if or $apiKeysUpstream .Values.web.root_redirect }}
          env:
            {{- if $apiKeysUpstream }}
            # The console's nginx proxies /api/v1/apikeys to the identity provider (Web/api-keys-route.sh).
            - name: API_KEYS_UPSTREAM
              value: {{ $auth.api_keys_upstream | quote }}
            {{- end }}
            {{- if .Values.web.root_redirect }}
            # The console's nginx redirects the bare / of its host there (Web/root-redirect.sh).
            - name: ROOT_REDIRECT
              value: {{ .Values.web.root_redirect | quote }}
            {{- end }}
          {{- end }}
          resources:
            limits:
              cpu: {{ .Values.web.cpu }}
              memory: {{ .Values.web.memory }}
            requests:
              cpu: {{ .Values.web.cpu }}
              memory: {{ .Values.web.memory }}
      {{- if .Values.global.image_pull_secret }}
      imagePullSecrets:
        - name: {{ .Values.global.image_pull_secret }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      priorityClassName: system-cluster-critical
      restartPolicy: Always