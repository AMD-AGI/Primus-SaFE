---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: primus-safe
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - amd.com
  resources:
  - addons
  - addontemplates
  - clusters
  - faults
  - models
  - nodeflavors
  - nodes
  - nodetemplates
  - opsjobs
  - resourcetemplates
  - roles
  - users
  - workloads
  - workspaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - amd.com
  resources:
  - addons/status
  - addontemplates/status
  - clusters/status
  - faults/status
  - models/status
  - nodeflavors/status
  - nodes/status
  - nodetemplates/status
  - opsjobs/status
  - resourcetemplates/status
  - roles/status
  - users/status
  - workloads/status
  - workspaces/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - '*'
- apiGroups:
  - apps
  resources:
  - '*'
  verbs:
  - '*'
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  - services
  - pods
  - pods/log
  - nodes
  - serviceaccounts
  - deployments
  - statefulsets
  - priorityclasses
  - endpoints
  - events
  verbs:
  - '*'
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - '*'
- apiGroups:
  - "postgres-operator.crunchydata.com"
  resources:
  - "postgresclusters"
  verbs:
  - '*'
# resource-manager reads admin-plane ClusterRoles to copy them to data planes; it writes data-plane
# RBAC with the Cluster's own client, never with this account.
- apiGroups:
  - "rbac.authorization.k8s.io"
  resources:
  - "clusterroles"
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "rbac.authorization.k8s.io"
  resources:
  - "clusterroles"
  - "clusterrolebindings"
  - "roles"
  - "rolebindings"
  # delete-preinstall-rbac (post-install/post-upgrade) removes the hook RBAC, including the
  # ClusterRole/ClusterRoleBinding of releases before the hook became namespaced.
  resourceNames:
  - secret-manager
  verbs:
  - get
  - delete
# Holding the "use" and "manage" verbs on workspaces lets resource-manager create and bind the projected roles that grant them.
- apiGroups:
  - amd.com
  resources:
  - workspaces
  verbs:
  - use
  - manage
# The workload webhook asks whether a sandbox user may use a workspace.
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - '*'
- apiGroups:
  - agents.x-k8s.io
  resources:
  - sandboxes
  verbs:
  - '*'
{{- if .Values.cicd.enable }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: manager-role
    app.kubernetes.io/part-of: gha-rs
    app.kubernetes.io/version: 0.13.0
    helm.sh/chart: gha-rs-0.13.0
  name: {{ .Values.cicd.role_name }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - delete
      - get
  - apiGroups:
      - ""
    resources:
      - pods/status
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - create
      - delete
      - get
      - patch
      - update
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
    verbs:
      - create
      - delete
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  name: github-runner
rules:
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
{{- end }}
{{- if .Values.monarch.enable }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: client
    app.kubernetes.io/name: monarch-operator
  name: {{ .Values.monarch.client_role }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - monarch.pytorch.org
    resources:
      - monarchmeshes
      - monarchmeshes/status
    verbs:
      - get
      - list
      - watch
{{- end }}
