{{- if include "primus-safe.identityAuthSecret" . }}
apiVersion: batch/v1
kind: Job
metadata:
  # Copy the identity introspection client secret into this release.
  name: copy-identity-auth-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: "before-hook-creation,hook-succeeded"
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  template:
    spec:
      activeDeadlineSeconds: 300
      restartPolicy: Never
      serviceAccountName: secret-manager
      {{- if .Values.global.image_pull_secret }}
      imagePullSecrets:
        - name: {{ .Values.global.image_pull_secret }}
      {{- end }}
      containers:
        - name: copy-secret
          image: {{ .Values.global.image_registry }}/primussafe/kubectl:latest
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              SOURCE_NAMESPACE={{ .Values.auth.identity_client_secret_namespace | default "primus-identity" | quote }}
              SOURCE_NAME={{ include "primus-safe.identityAuthSourceSecret" . | quote }}
              TARGET_NAMESPACE={{ .Release.Namespace | quote }}
              TARGET_NAME={{ include "primus-safe.identityAuthSecret" . | quote }}

              if kubectl get secret "${TARGET_NAME}" -n "${TARGET_NAMESPACE}" -o name >/dev/null 2>&1; then
                  echo "Info: Secret ${TARGET_NAME} already exists in ${TARGET_NAMESPACE}"
                  exit 0
              fi

              if ! err=$(kubectl get secret "${SOURCE_NAME}" -n "${SOURCE_NAMESPACE}" -o json 2>&1); then
                  echo "Info: identity Secret ${SOURCE_NAMESPACE}/${SOURCE_NAME} is not available; skip"
                  exit 0
              fi

              value=$(printf '%s' "${err}" | yq -r '.data["client-secret"] // .data.client_secret // ""')
              if [ -z "${value}" ] || [ "${value}" = "null" ]; then
                  echo "Info: identity Secret ${SOURCE_NAMESPACE}/${SOURCE_NAME} has no client secret; skip"
                  exit 0
              fi

              kubectl -n "${TARGET_NAMESPACE}" create secret generic "${TARGET_NAME}" \
                  --from-literal=client-secret="$(printf '%s' "${value}" | base64 -d)"
              echo "Copied ${SOURCE_NAMESPACE}/${SOURCE_NAME} to ${TARGET_NAMESPACE}/${TARGET_NAME}"
              exit 0
{{- end }}
