apiVersion: batch/v1
kind: Job
metadata:
  name: "delete-preinstall-rbac"
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Release.Name }}
      {{- if .Values.global.image_pull_secret }}
      imagePullSecrets:
        - name: {{ .Values.global.image_pull_secret }}
      {{- end }}
      containers:
        - name: main
          image: {{ .Values.global.image_registry }}/primussafe/kubectl:latest
          command:
            - sh
            - -c
            - |
              set -e
              # Hook RBAC of this release (see rbac.yaml).
              kubectl -n {{ .Release.Namespace }} delete rolebinding secret-manager --ignore-not-found
              kubectl -n {{ .Release.Namespace }} delete role secret-manager --ignore-not-found
              {{- with include "primus-safe.openSearchCopySourceNamespace" . }}
              kubectl -n {{ . }} delete rolebinding secret-manager --ignore-not-found
              kubectl -n {{ . }} delete role secret-manager --ignore-not-found
              {{- end }}
              {{- if include "primus-safe.identityAuthSecret" . }}
              {{- $identityNamespace := .Values.auth.identity_client_secret_namespace | default "primus-identity" }}
              kubectl -n {{ $identityNamespace }} delete rolebinding secret-manager --ignore-not-found
              kubectl -n {{ $identityNamespace }} delete role secret-manager --ignore-not-found
              {{- end }}
              # Releases before the hook became namespaced created these cluster-wide.
              kubectl delete clusterrolebinding secret-manager --ignore-not-found
              kubectl delete clusterrole secret-manager --ignore-not-found
              kubectl -n {{ .Release.Namespace }} delete serviceaccount secret-manager --ignore-not-found
