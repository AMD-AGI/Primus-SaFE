# Creates <release>-email-relay-submit (key token) once: the token that authorizes only
# POST /api/v1/email-relay/submit (header X-Email-Relay-Token). An existing Secret is kept.
# With notification.email_relay.identity_namespace set, the current token is also written to a
# Secret of the same name in that namespace on every install and upgrade.
{{- if .Values.db.enable }}
{{- $copyNamespace := include "primus-safe.emailRelayCopyNamespace" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: generate-email-relay-token
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: "before-hook-creation,hook-succeeded"
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  template:
    metadata:
      labels:
        app: random-secret-generator
    spec:
      activeDeadlineSeconds: 300
      restartPolicy: OnFailure
      serviceAccountName: secret-manager
      {{- if .Values.global.image_pull_secret }}
      imagePullSecrets:
        - name: {{ .Values.global.image_pull_secret }}
      {{- end }}
      containers:
        - name: generate-token
          image: {{ .Values.global.image_registry }}/primussafe/kubectl:latest
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              if kubectl -n {{ .Release.Namespace }} get secret {{ .Release.Name }}-email-relay-submit > /dev/null 2>&1; then
                echo "Secret already exists. Skipping token generation."
              else
                head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' | base64 | tr -d '\n' > /tmp/token.b64

                cat <<EOF > /tmp/secret.yaml
              apiVersion: v1
              kind: Secret
              metadata:
                name: {{ .Release.Name }}-email-relay-submit
                namespace: {{ .Release.Namespace }}
                annotations:
                  meta.helm.sh/release-name: {{ .Release.Name }}
                  meta.helm.sh/release-namespace: {{ .Release.Namespace }}
              type: Opaque
              data:
                token: $(cat /tmp/token.b64)
              EOF

                kubectl apply -f /tmp/secret.yaml
                echo "create email relay submit secret successfully"
              fi
              {{- if $copyNamespace }}
              TOKEN_B64="$(kubectl -n {{ .Release.Namespace }} get secret {{ .Release.Name }}-email-relay-submit -o jsonpath='{.data.token}')"
              [ -n "$TOKEN_B64" ] || { echo "email relay submit secret has no token"; exit 1; }
              cat <<EOF > /tmp/copy.yaml
              apiVersion: v1
              kind: Secret
              metadata:
                name: {{ .Release.Name }}-email-relay-submit
                namespace: {{ $copyNamespace }}
              type: Opaque
              data:
                token: ${TOKEN_B64}
              EOF
              kubectl apply -f /tmp/copy.yaml
              echo "copied email relay submit secret to {{ $copyNamespace }}"
              {{- end }}
              exit 0
{{- end }}
