# Identity of the pre-install/pre-upgrade jobs that create the release's own secrets
# (generate-crypto-secret, generate-ssh-secret, copy-opensearch-secret).
# Its rights are a Role in the release namespace, limited to those secrets, so the account that runs
# helm needs no cluster-wide RBAC rights to create it. delete-preinstall-rbac removes all of it
# after the release is installed.
{{- $openSearchSecret := include "primus-safe.openSearchCopySecret" . }}
{{- $openSearchNamespace := include "primus-safe.openSearchCopySourceNamespace" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: "before-hook-creation"
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: "before-hook-creation"
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
rules:
  # The jobs read their secret by name and write it with kubectl apply (get, then create or patch).
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - {{ printf "%s-crypto" .Release.Name | quote }}
      - {{ printf "%s-ssh-proxy" .Release.Name | quote }}
      {{- if $openSearchSecret }}
      - {{ $openSearchSecret | quote }}
      {{- end }}
    verbs:
      - get
      - patch
      - update
  # Kubernetes cannot limit create to a name.
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: "before-hook-creation"
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: secret-manager
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: secret-manager
  apiGroup: rbac.authorization.k8s.io
{{- if $openSearchNamespace }}
---
# copy-opensearch-secret reads the source secret from another namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-manager
  namespace: {{ $openSearchNamespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: "before-hook-creation"
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - {{ $openSearchSecret | quote }}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-manager
  namespace: {{ $openSearchNamespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: "before-hook-creation"
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: secret-manager
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: secret-manager
  apiGroup: rbac.authorization.k8s.io
{{- end }}
