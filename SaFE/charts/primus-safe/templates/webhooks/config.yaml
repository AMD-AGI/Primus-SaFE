apiVersion: v1
data:
  config.yaml: |
    net:
      # RDMA device name
      rdma_name: {{ .Values.net.rdma_name }}
    server:
      # The port of webhooks server
      port: {{ default 8084 (default .Values.webhooks).port }}
    health_check:
      # Whether to enable health check
      enable: {{ default true (default .Values.k8s).enable_health_check }}
      # The port of health check
      port: {{ default 8085 (default .Values.webhooks).health_port }}
    metrics:
      enable: true
      port: {{ default 8000 (default .Values.job_manager).metrics_port }}
    leader_election:
      # LeaderElection determines whether or not to use leader election when starting the manager.
      enable: true
    workspace:
      # The percentage of memory reserved for the system.
      mem_reserve_percent: {{ default 0.02 (default .Values.workspace).mem_reserve_percent }}
      # The percentage of cpu reserved for the system.
      cpu_reserve_percent: {{ default 0.06 (default .Values.workspace).cpu_reserve_percent }}
      # The percentage of storage reserved for the system.
      ephemeral_store_reserve_percent: {{ default 0.1 (default .Values.workspace).ephemeral_store_reserve_percent }}
    workload:
      # The lifecycle of the workload after completion, in seconds. Default is 60.
      ttl_second: {{ default 3600 (default .Values.workload).ttl_second }}
      # The maximum percentage of ephemeral storage that can be used by a workload.
      max_ephemeral_store_percent: {{ default 0.6 (default .Values.workload).max_ephemeral_store_percent }}
    ssh:
      # Whether to enable ssh, Users can log in directly to their own pods.
      enable: {{ .Values.ssh.enable }}
    auth:
      # The webhooks process reads this the same way the apiserver does. Without it every gate
      # that checks auth.mode stays on the builtin default.
      mode: {{ default "builtin" .Values.auth.mode | quote }}
    users:
      {{- include "primus-safe.usersConfig" . | nindent 6 }}
    {{- $admission := default dict (default dict .Values.sandbox).admission }}
    {{- $origin := include "primus-safe.publicOrigin" . }}
    {{- $jwksURL := $admission.jwks_url }}
    {{- if and (not $jwksURL) $origin }}
    {{- $jwksURL = printf "%s/.well-known/jwks.json" $origin }}
    {{- end }}
    {{- $issuer := $admission.issuer }}
    {{- if and (not $issuer) $origin }}
    {{- $issuer = $origin }}
    {{- end }}
    sandbox:
      admission:
        # Whether Workloads created by the sandbox control plane are checked against the identity assertion and workspace membership.
        enabled: {{ default false $admission.enabled }}
        creator: {{ default "" $admission.creator | quote }}
        jwks: {{ default "" $admission.jwks | quote }}
        jwks_url: {{ $jwksURL | quote }}
        issuer: {{ $issuer | quote }}
        audience: {{ default "" $admission.audience | quote }}
        token_type: {{ default "" $admission.token_type | quote }}
        algorithm: {{ default "" $admission.algorithm | quote }}
        actor: {{ default "" $admission.actor | quote }}
        detail_type: {{ default "" $admission.detail_type | quote }}
        annotation: {{ default "" $admission.annotation | quote }}
        kind: {{ default "" $admission.kind | quote }}
        ca_file: {{ if $admission.ca_secret }}"/etc/secrets/admission-ca/ca.crt"{{ else }}""{{ end }}
    rbac:
      subject_prefix: {{ default "primus:" (default dict .Values.rbac).subject_prefix | quote }}
    ops_job:
      # The lifecycle of the opsjob after completion, in seconds. Default is 60.
      ttl_second: {{ default 60 (default .Values.ops_job).ttl_second }}
      # The timeout of the opsjob, in seconds. Default is 3600.
      timeout_second: {{ default 3600 (default .Values.ops_job).timeout_second }}
      export_image:
        # The default timeout for saving a workload as an image, in seconds. Default is 43200 (12 h).
        timeout_second: {{ default 43200 (default dict (default dict .Values.ops_job).export_image).timeout_second }}
    external_execution:
      # Off by default; external objects are refused at admission while it is false.
      enabled: {{ default false (default dict .Values.external_execution).enabled }}
      observation_max_age_seconds: {{ default 120 (default dict .Values.external_execution).observation_max_age_seconds }}
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-webhooks
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
