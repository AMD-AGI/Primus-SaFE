# Example overlay for external execution (kube-scheduler placement).
# Copy and fill site-specific values; do not commit real endpoints into the public chart.
#
#   helm upgrade primus-safe <chart> -n primus-safe --reuse-values \
#     -f values-external-execution.yaml

external_execution:
  enabled: true
  observation_max_age_seconds: 120
  workspace_resync_seconds: 30
