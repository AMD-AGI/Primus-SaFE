#
# Default chart values. Site-specific overrides (image registries, storage
# classes, secret names, per-cluster endpoints, etc.) belong in a private
# operations repo and should be applied via `helm upgrade ... -f ...`, not
# committed to this chart.
global:
  # Domain and sub_domain are mainly used for console access
  domain: "primus-safe.amd.com"
  sub_domain: ""
  # Image registry address where management components are uploaded
  image_registry: "docker.io"
  # Secret used for image downloading, created via install.sh
  image_pull_secret: "primus-safe-image"
  # TLS secret used by Higress Ingress. install.sh creates this secret when
  # Higress ingress is selected.
  tls_secret: "default"
  # Kubernetes storage class for persistent storage
  storage_class: "local-path"
  # csi volume handle name for wekafs
  csi_volume_handle: ""
net:
  # Network interface for NCCL socket communication
  nccl_socket_ifname: "eno0"
  # RDMA network interfaces for high-performance communication
  nccl_ib_hca: "rdma0,rdma1,rdma2,rdma3,rdma4,rdma5,rdma6,rdma7"
  # RDMA resource name
  rdma_name: "rdma/hca"
  # Ingress component name selected during install.sh
  ingress: "higress"
# CD (Continuous Deployment) configuration
cd:
  # Whether deployment requests require approval from another user
  # true: users cannot approve their own requests (production environment)
  # false: users can self-approve their own requests (development environment)
  require_approval: true
  # This list is of deployable components
  components: "apiserver,resource_manager,job_manager,webhooks,web,preprocess,node_agent,cicd_runner,cicd_unified_job,model_downloader,ops_download,monarch"
  # GPU type for this cluster (e.g. "MI300X", "MI325X"). Can be overridden via env_file_config (gpu_type=MI300X).
  gpu_type: "MI300X"
apiserver:
  # Apiserver component image version
  image: "apiserver:latest"
  # Number of replicas for apiserver deployment
  replicas: 2
  # CPU resources allocated to apiserver
  cpu: 2000m
  # Memory resources allocated to apiserver
  memory: 4Gi
  # The nodeport for apiserver service
  node_port: 32495
# OpenTelemetry tracing configuration
tracing:
  # Enable distributed tracing (configured via .env)
  enable: true
resource_manager:
  # Resource manager component image version
  image: "resource-manager:latest"
  # Number of replicas for resource manager deployment
  replicas: 1
  # CPU resources allocated to resource manager
  cpu: 2000m
  # Memory resources allocated to resource manager
  memory: 4Gi
job_manager:
  # Job manager component image version
  image: "job-manager:latest"
  # Number of replicas for job manager deployment
  replicas: 1
  # CPU resources allocated to job manager
  cpu: 2000m
  # Memory resources allocated to job manager
  memory: 4Gi
  # Port for Prometheus metrics endpoint
  metrics_port: 8000
  # Optional hostAliases for the job-manager Pod (e.g. map the external capacity
  # controller Service name to a reachable IP when cluster DNS cannot resolve it).
  # Example:
  #   hostAliases:
  #     - ip: "10.0.0.1"
  #       hostnames:
  #         - controller.example.svc
  hostAliases: []
webhooks:
  # Webhooks component image version
  image: "webhooks:latest"
  # Number of replicas for webhooks deployment
  replicas: 1
  # CPU resources allocated to webhooks
  cpu: 2000m
  # Memory resources allocated to webhooks
  memory: 4Gi
web:
  # Web console component image version
  image: "primus-safe-web:latest"
  # Number of replicas for web console deployment
  replicas: 1
  # CPU resources allocated to web console
  cpu: 2000m
  # Memory resources allocated to web console
  memory: 4Gi
preprocess:
  # Preprocessing component image version. used for pytorch-job etc.
  image: "preprocess:latest"
monarch:
  enable: true
  image: "monarch:latest"
  client_role: "monarch-client"
ops_job:
  # Opsjob download image version. used for download file
  download_image: "s3-downloader:latest"
  # Opsjob evalscope image version. used for model evaluation
  evalscope_image: "evalscope:latest"
  export_image:
    # Default timeout for saving a workload as an image, in seconds (12 h); a request's own
    # timeoutSecond stands.
    timeout_second: 43200
cicd:
  enable: true
  role_name: "gha-rs-manager"
  controller_name: "gha-runner-scale-set-gha-rs-controller"
  github_runner_image: "ghcr.io/actions/actions-runner:2.328.0"
  github_runner_dind_image: "docker:28.3.3-dind"
  # Cluster-wide proxy bypass list merged into every CI/CD workload's proxy
  # configuration, for hosts a workload cannot know about (package mirrors,
  # internal registries). In-cluster targets are always bypassed.
  no_proxy: ""
  # Sidecar that fronts the cluster proxy for CI/CD jobs, for a proxy whose
  # authentication the runner's own HTTP client cannot complete. Empty disables it.
  # Relative to global.image_registry/primussafe/ (see github_*_runner_template).
  proxy_relay_image: "cicd-proxy-relay:latest"
  proxy_relay_port: 3129
  # Budget for the OpenSearch lookup that appends the ARC controller error to a failed
  # CI/CD workload. Enrichment is single-shot, so a lookup that times out leaves the
  # workload with its generic failure message. Raise it on clusters where the log index
  # is slow; it runs on a background queue and never delays the failure itself.
  failure_enrich_timeout_seconds: 30
  # Destinations the relay sends through the cluster proxy, as squid dstdomain patterns;
  # a leading dot matches the domain and its subdomains. Everything else goes direct.
  # The default covers what the IP allow list actually gates: git and the API
  # (.github.com), raw/artifact/actions endpoints and ghcr blobs (.githubusercontent.com),
  # and the container registry (.ghcr.io). Package mirrors and internal registries stay
  # direct, which is what keeps them working when the proxy does not serve them.
  # Setting this to "" forces EVERY destination upstream with no direct fallback: anything
  # the proxy refuses then fails as an opaque tunnel error. Only do that when the proxy is
  # a general-purpose forward proxy for all egress.
  proxy_relay_upstream_domains: ".github.com .githubusercontent.com .ghcr.io"  # cicd component image version. used for starting jobs for runner
  runner: "cicd-runner-proxy:latest"
  unified_job: "cicd-unified-job-proxy:latest"
  # Max concurrent ephemeral runners per AutoscalingRunnerSet (CI concurrency).
  # Can be overridden per deploy via cd-deploy.sh COMPONENT_TAGS="cicd.max_runners=<n>".
  max_runners: 1024
  # Min warm ephemeral runners per AutoscalingRunnerSet. Must be >0 so the entry
  # job (Build matrix / Dispatch) is never acquired by a cold-starting runner
  # that dies before reporting — which orphans the job and stalls the whole run.
  min_runners: 2
db:
  # Enable database for historical job queries, defaults to true
  enable: true
  # Session the driver must be given, checked when the connection is made.
  # "read-write" refuses one that cannot write, so a connection reaching a
  # demoted replica fails at connect instead of failing every write later with
  # "cannot execute INSERT in a read-only transaction". Every component using
  # this database writes, so that is the right default. Clear it only for a
  # deployment whose db host deliberately resolves to a replica -- with it set,
  # such a host cannot connect at all.
  target_session_attrs: "read-write"
  # db.max_life_time_second is left unset on purpose. Its default of 600 is what
  # retires a connection stranded on a demoted replica after a failover. If you
  # do override it, do not set it to 0: database/sql reads 0 as "reusable for as
  # long as the process lives", the unbounded reuse that kept a pool writing to a
  # demoted replica for three days. Nothing reports that at runtime beyond one
  # warning at startup, so a 0 is easy to miss.
robust:
  # Secret (in the release namespace) holding the shared service token the
  # Robust API accepts in X-Robust-Service-Token, under the key
  # "service-token". apiserver, job-manager and resource-manager send it on
  # every call to a data cluster's robust-api: log search, post-train metrics,
  # GPU statistics and the workload sync. The same value must be configured
  # on robust-manager (modules.robustApi.auth.writeGuard.serviceTokenExistingSecret
  # in the primus-robust chart); without it every one of those calls gets 401.
  # The mount is optional, so the components start while the Secret is absent.
  # Set to "" to stop mounting it.
  service_token_secret: "robust-service-token"
  # Where the Secret is mounted in the three components.
  secret_path: "/etc/secrets/robust"
opensearch:
  # Log search feature flag. When true, log search endpoints are available.
  # Queries are proxied through robust-api on data clusters (no direct OpenSearch connection).
  enable: true
  # Index prefix used to build the date-scoped OpenSearch URIs for pod/node
  # logs, e.g. "<prefix>2026.04.21". Must match the prefix fluentbit is
  # actually writing to. The current primus-robust FluentBit config writes
  # pod/node logs to `node-<date>` indices; the legacy "fluentbit-" prefix
  # applied to the old primus-lens deployment and produced
  # "no such index [fluentbit-2026.04.21]" 404s after the migration.
  prefix: "node-"
  secret: "primus-safe-opensearch-config"
  secret_namespace: "primus-safe"
  secret_path: "/etc/secrets/opensearch"
  # Default points at the OpenSearch Service this project's robust stack
  # provisions in each data cluster. SaFE apiserver doesn't dial this
  # directly (queries always go through robust-analyzer), but the value is
  # baked into the UI/envs response so keep it aligned with reality.
  # Previous default pointed at the removed primus-lens service.
  endpoint: "primus-robust-logs.primus-robust.svc.cluster.local:9200"
ssh:
  # Enable SSH access to user containers
  enable: true
  # SSH server IP for jump server access
  server_ip: ""
  # Remote port forwarding (`ssh -R` / RemoteForward). The listen socket is opened
  # inside the user's target Pod, letting Pod processes reach a proxy running on
  # the developer's machine. The apiserver copies the pod-side listener into the
  # container for the life of the forward, so nothing has to be in the workload image.
  reverse_forward:
    # On by default. Set to false where pod traffic must not be able to leave through
    # a developer's network; what keeps it contained otherwise is the rest of this
    # section, not the switch.
    enable: true
    # Only loopback inside the Pod, so no other workload on the node can use it.
    bind_addresses:
      - 127.0.0.1
    # Ports the pod-side listener may bind. The floor keeps a forward from shadowing
    # a privileged service inside the pod; per-session count, not range width, is
    # what bounds how many listeners a user can hold.
    port_min: 1024
    port_max: 65535
    max_forwards_per_session: 8
tls:
  # Verify TLS certificates for outbound HTTPS calls to model endpoints and
  # third-party services (InferenceX). Defaults to false to
  # stay compatible with self-signed ingress certificates and images without an
  # updated CA bundle. Set to true in deployments that provide valid certs/CA.
  verify_outbound: false
# What every user holds when an administrator has granted nothing. The defaults are what the
# platform has always done: everyone holds the `default` role and joins the workspaces marked as
# default. A deployment that wants a new user to start with no access sets base_roles to
# [self-read] (a built-in role that lets a user read their own user record only) and
# join_default_workspaces to false; an administrator then grants the roles and workspaces.
users:
  # Roles every user who is not a system administrator holds. The admission webhook adds the ones
  # a user lacks when the user is created or updated, and in external authentication mode the
  # apiserver adds them to every request. The platform roles (system-admin, system-admin-readonly)
  # and workspace-admin are ignored here; an empty list is the default.
  # Every role named here must exist as a Role object (primus-safe-cr creates self-read) before
  # the webhook can create a user, so install or upgrade primus-safe-cr first.
  base_roles:
    - default
  # Whether every user joins the workspaces marked as default: when a user is created or updated, and
  # when an administrator marks a workspace as default. When false neither adds anyone; an
  # administrator adds the users to the workspaces they should be in.
  join_default_workspaces: true
console:
  # The line the web console's "no access yet" page shows to a user who holds no access. Plain
  # text; set it to "" to show none.
  access_contact: "请联系管理员开通"
# Pluggable authentication, in the Kubernetes style. Authorization (roles, workspaces) always stays in SaFE.
# See docs/apis/external-authentication.md.
auth:
  # builtin: the apiserver's own accounts, sessions, SSO login and API keys (default, nothing else to configure).
  # external: requests are authenticated by `authenticators`, in order; the first to accept decides.
  mode: builtin
  # Entries when mode is external. Durations are Go durations ("30s", "30m").
  #   - type: oidc        # validate JWTs from one issuer
  #     issuer: https://idp.example.com
  #     audience: safe-apiserver          # required
  #     jwks_url: ""                      # default: from the issuer's discovery document
  #     clock_skew: 30s
  #     jwks_cache_ttl: 10m
  #     id_claim: sub
  #     username_claim: preferred_username
  #     email_claim: email
  #     groups_claim: groups
  #   - type: introspection   # OAuth 2.0 token introspection (RFC 7662), for opaque tokens such as API keys
  #     issuer: https://idp.example.com   # its discovery document names the endpoint when url is empty
  #     url: ""                           # the introspection endpoint
  #     audience: safe-apiserver          # required: the answer's aud (else client_id) must name it
  #     allow_missing_audience: false     # true accepts answers that name no audience, e.g. an API key's
  #     client_id: safe-apiserver
  #     client_secret_file: /etc/secrets/auth/client-secret   # the mounted auth.client_secret Secret
  #     ca_bundle: ""                     # PEM text or file path
  #     timeout: 5s
  #     cache_ttl: 30s
  #     cache_negative_ttl: 5s
  #     stale_if_error: 30m               # keep accepted credentials working while the endpoint is down
  #   - type: builtin     # fall through to the built-in mode; what it authenticates holds no platform role
  authenticators: []
  # Name of the Secret that holds the client secret of an `introspection` authenticator, under the key
  # `client-secret`. It is mounted into the apiserver at client_secret_path. Leave empty when unused.
  client_secret: ""
  client_secret_path: /etc/secrets/auth
  # Identity groups mapped to SaFE roles on every request; never stored on the user.
  #   - group: platform-admins
  #     roles: [system-admin]
  #   - group: team-a-leads
  #     roles: [workspace-admin]
  #     workspaces: [team-a]
  group_mappings: []
  # Where the console sends users to sign in when mode is external.
  login_url: ""
  # Client ids of the parties that may call POST /auth/verify with a delegated token (RFC 8693: an `act`
  # claim naming the client) and receive the keys of the user the token acts for, and of that user only.
  # The token must carry the safe.api scope and be accepted by an authenticator of the chain, which checks
  # its audience. Exact ids, no wildcards. Empty (the default): a delegated token never calls it.
  key_actors: []
  # Where API key creation, listing and revocation are routed to the identity provider when mode is external:
  # a path on the console's own origin, such as /api/v1/apikeys. The apiserver refuses to issue keys in that
  # mode, so the console offers "Create API Key" and uses this path only when it is set (it is reported by
  # GET /envs as apiKeysUrl); empty, it offers no key creation. Set it by itself when your own gateway routes
  # the path to the identity provider; setting api_keys_upstream makes it /api/v1/apikeys whatever is set here.
  api_keys_url: ""
  # The identity provider's service that serves /api/v1/apikeys, as host[:port] with a full in-cluster DNS
  # name (service.namespace.svc.cluster.local:port; the console's resolver does not use search domains).
  # With mode external and this set, the console's nginx proxies /api/v1/apikeys there, ahead of its route to
  # the apiserver, so no gateway rule is needed. /api/apikeys, the console's alias to the apiserver, is not
  # touched: it lists and revokes the keys the apiserver issued before the switch. Ignored when mode is not
  # external.
  api_keys_upstream: ""
sso:
  # Enable sso login
  enable: true
  # The secret for sso, which contains the id, secret, endpoint and redirect_uri
  secret: "primus-safe-sso"
  # Path to mount sso secret
  secret_path: "/etc/secrets/sso"
  # Other web apps allowed to receive the SSO authorization code (the console's own origin is always allowed).
  # Each entry is an origin, optionally followed by a path prefix, e.g. "https://app.example.com/console".
  bridge_allowlist: []
  # The console signs in at an OpenID Connect provider as a public client (no client secret) with PKCE,
  # instead of at the provider of the secret above. Off by default. The provider of the secret, when it is
  # still set, keeps serving the codes other web apps bring (SSO bridge) and the sessions it made; set the
  # secret to an empty string to remove it once nothing uses it.
  login:
    enable: false
    # Issuer of the provider (its discovery document is <issuer>/.well-known/openid-configuration).
    issuer: ""
    # Client id the console is registered with there.
    client_id: ""
    # The console's own callback, registered exactly at the provider, e.g. "https://console.example.com/sso/callback".
    redirect_uri: ""
workspace:
  # Reserved system resources for management components
  mem_reserve_percent: 0.05
  cpu_reserve_percent: 0.07
  ephemeral_store_reserve_percent: 0.05
s3:
  # Enable S3 service access, mainly used for log downloading
  enable: false
  # Secret containing S3 access key and secret key, bucket and endpoint
  secret: "primus-safe-s3"
  # Path to mount S3 secret
  secret_path: "/etc/secrets/s3"
notification:
  # Email notification configuration (optional)
  # If configured, notifications will be enabled automatically
  email:
    # SMTP server host
    smtp_host: ""
    # SMTP server port (587 for STARTTLS, 465 for SSL)
    smtp_port: 587
    # SMTP authentication username
    username: ""
    # SMTP authentication password
    password: ""
    # Email address used as sender
    from: ""
    # Use TLS/SSL (true for port 465, false for port 587 STARTTLS)
    use_tls: false
  # Email relay mode (for clusters that cannot reach SMTP directly)
  # When enabled, emails are queued in DB and streamed via SSE to a central relay service.
  # Takes precedence over direct email when both are configured.
  email_relay:
    # Enable email relay mode
    enable: true
grafana:
  # Enable Grafana for monitoring metrics display
  enable: false
  # Grafana password
  password: ""
  # One entry per data cluster whose VictoriaMetrics should appear as a
  # Grafana datasource. `name` becomes both the datasource uid and display
  # name — dashboards resolve var-cluster=<name> against the uid, so the
  # value MUST match the Cluster CR name that SaFE uses.
  # `vmSelectUrl` should point to that cluster's vmselect (typically a
  # NodePort on a control-plane node or an Ingress). Set isDefault: true on
  # the cluster you want to see first in any Prometheus picker.
  # Example:
  #   dataClusters:
  #     - name: core42
  #       vmSelectUrl: http://10.245.129.5:32481/select/0/prometheus
  #       isDefault: true
  dataClusters: []
  # Legacy: a single chart-managed Lens-compat JSON datasource pointing at
  # one robust-analyzer endpoint. Replaced by the resource-manager
  # GrafanaDatasourceSyncer, which creates a per-cluster
  # "<cluster>-robust-api" datasource (uid matches the data cluster name)
  # whenever a primus-robust addon comes online. Kept on the values surface
  # only so old override files don't error out; the field is no longer
  # consumed by any template.
  lensApiUrl: ""
addon:
  # Default components installed with the system
  default: cert-manager.v1.17.2,training-operator.1.9.2,network-operator.25.4.0,kube-scheduler-plugins-0.31.8,amd-gpu-operator-charts-v1.4.0,csi-wekafsplugin.2.7.7
proxy:
  # Proxy services configuration for reverse proxying to backend services
  # Each service will be accessible via apiserver with authentication
  services: []
  # Example configuration:
  # services:
  #   - name: my-service
  #     prefix: /my-service
  #     target: http://my-service:8080
  #     enabled: true

# NOTE: the legacy /lens/v1/* URL prefix (gpu-aggregation, training, logs,
# workloads) is now served by apiserver's built-in lens-compat handler.
# The handler picks the target robust-analyzer dynamically from the Cluster
# CR annotation (primus-safe.amd.com/robust-api-endpoint) of whichever
# cluster the request's ?cluster=<name> query parameter names, so there is
# no longer any lens_compat_proxy value to configure here.
langfuse_proxy:
  # Langfuse proxy: unified Trace ingestion via SaFE API Key (ak-xxx)
  enable: false
  # Internal Langfuse service address
  target: "http://langfuse-web.langfuse.svc.cluster.local:3000/langfuse"
  # Secret name for shared Langfuse project credentials
  secret: "primus-safe-langfuse-proxy"
  secret_path: "/etc/secrets/langfuse-proxy"
  # Shared Langfuse project credentials (stored in Secret, not ConfigMap)
  public_key: ""
  secret_key: ""
llm_gateway:
  enabled: true
  secret_path: "/etc/secrets/llm-gateway"
# Model Optimization (Hyperloom via PrimusClaw). Routes register when db.enable; set claw_base_url / secret for Claw.
model_optimization:
  claw_base_url: ""
  claw_agent_id: "agent_default"
  # Empty: skip file-based claw_api_key / claw_base_url; use Bearer ak-... or set a mount path.
  secret_path: ""
  default_workspace: "control-plane-sandbox"
  # Per-workspace cap on concurrently running optimization tasks. Overridable
  # per-deploy via .env `optimize_max_concurrent` (synced into values.yaml by
  # upgrade.sh and into the live apiserver ConfigMap by cd-deploy.sh).
  max_concurrent: 1024
# Post Training (slime). When enabled, the post-training-registry ConfigMap is rendered from
# post_training.registry; the apiserver and the Post Training controller treat a missing ConfigMap
# as Post Training being disabled. Override the registry per cluster to enable images and features
# once they pass acceptance.
post_training:
  enabled: false
  registry:
    frameworks:
      - name: slime
        default: true
        compiler: slime
        adapter: frameworks/slime
        importFormats: [slime-rocm]
        metrics:
          include: ["train/*", "eval/*", "eval/*/*", "rollout/*", "rollout/*/*", "perf/*", "passrate/*"]
          summary: {sft: train/loss, rl: rollout/raw_reward}
          better: {"train/loss": lower, "eval/*/loss": lower, "rollout/raw_reward": higher, "eval/*": higher, "eval/*-truncated_ratio": lower, "passrate/*": higher}
          samples: {rolloutGroups: 4, evalPerSet: 8, promptChars: 2000, responseHeadChars: 1000, responseTailChars: 3000, maxRows: 50000}
          maxPointsPerRun: 2000000
          panels:
            sft:
              - {id: loss, series: [train/loss, "eval/*/loss"], smooth: true}
              - {id: lr, series: ["train/lr-pg_*"]}
              - {id: grad_norm, series: [train/grad_norm], logY: true}
              - {id: throughput, series: [perf/actor_train_tok_per_s, perf/actor_train_tflops]}
            rl:
              - {id: reward, series: [rollout/raw_reward, "eval/*"], smooth: true}
              - {id: signal, series: ["rollout/zero_std/count_*"], per: prompts, stack: true, when: grpo}
              - {id: passrate, series: ["passrate/pass@*", "eval/*-pass@*"], when: present}
              - {id: policy, series: [train/pg_loss, train/kl_loss, train/ppo_kl]}
              - {id: clip_entropy, series: [train/pg_clipfrac, train/entropy_loss]}
              - {id: consistency, series: [train/train_rollout_logprob_abs_diff, train/tis, train/ois, train/tis_clipfrac]}
              - {id: length, band: [rollout/response_len/min, rollout/response_len/max], series: [rollout/response_len/median, rollout/truncated, rollout/repetition_frac, "eval/*-truncated_ratio"]}
              - {id: time, series: [perf/rollout_time, perf/data_preprocess_time, perf/log_probs_time, perf/ref_log_probs_time, perf/actor_train_time, perf/update_weights_time, perf/save_model_time, perf/sleep_time, perf/wake_up_time], stack: true, rest: perf/step_time}
              - {id: engine, series: [perf/tokens_per_gpu_per_sec, perf/longest_sample_tokens_per_sec, rollout/prefix_cache_hit_rate, rollout/spec_accept_rate]}
              - {id: grad_perf, series: [train/grad_norm, perf/step_time, perf/actor_train_tok_per_s, perf/wait_time_ratio]}
              - {id: staleness, series: [rollout/staleness/mean, rollout/staleness/max], when: async}
              - {id: critic, series: [train/critic-value_loss, train/critic-value_clipfrac], when: ppo}
              - {id: mtp, series: [train/mtp_loss], when: present}
            system:
              - {id: gpu_util, series: [system/gpu_util_mean, "system/*/gpu_util_mean"], band: [system/gpu_util_min, system/gpu_util_max], axis: time}
              - {id: gpu_mem, series: [system/gpu_mem_used_mean_gb, system/gpu_mem_used_max_gb, system/gpu_mem_total_gb, "system/*/gpu_mem_used_mean_gb", "system/*/gpu_mem_used_max_gb", "system/*/gpu_mem_total_gb"], axis: time}
    specs:
      - name: qwen3-4B
        match: {architectures: [Qwen3ForCausalLM], num_hidden_layers: 36, hidden_size: 2560,
                num_attention_heads: 32, num_key_value_heads: 8, rope_theta: 1000000}
        evalTp: 1
        checkpoint: {keepLast: 0}
