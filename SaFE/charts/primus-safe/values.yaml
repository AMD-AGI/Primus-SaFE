            freeze: {allowed: true, default: ['^(?!.*decoder\.layers\.([0-9]|[1-6][0-9])\.mlp\.experts\.)']}
            defaults: {tp: 2, pp: 2, cp: 2, ep: 8, gpusPerEngine: 8, maxTokensPerGpu: 16384}
