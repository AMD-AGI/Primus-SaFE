        evalInference:
          image: primussafe/sglang:v0.5.18-rocm720-mi35x-aiter-dbd8bf5-flydsl032-20260921
          env: {SGLANG_USE_AITER: "1", SGLANG_OPT_USE_TOPK_V2: "0", SGLANG_DSA_HIP_DISABLE_PRESHUFFLE: "1"}
          extraArgs: "--kv-cache-dtype fp8_e4m3 --dsa-prefill-backend tilelang --dsa-decode-backend tilelang --chunked-prefill-size 8192 --reasoning-parser glm45 --tool-call-parser glm47"
        checkpoint: {keepLast: 2, keepBest: true}
