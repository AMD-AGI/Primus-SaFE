    images:
      # Registered unvalidated: mark validated and list features once the Qwen3-4B SFT and GRPO smoke runs
      # pass on the target nodes.
      - image: primussafe/slime:540ea91-rocm724-gfx950
        framework: slime
        arch: [gfx950]
        frameworkCommit: 540ea91
        megatronBridge: v0.6.2
        env: {RAY_EXPERIMENTAL_NOSET_HIP_VISIBLE_DEVICES: "1"}
        validated: false
        features: []
    gpuArch: {MI300X: gfx942, MI325X: gfx942, MI350X: gfx950, MI355X: gfx950}
    # Multi-node runs get network.ainic.env. Clusters with AINIC set it to the values the older SFT
    # job uses: USING_AINIC=1, NCCL_IB_GID_INDEX=1, NCCL_DMABUF_ENABLE=0, NCCL_MAX_P2P_CHANNELS=56,
    # NET_OPTIONAL_RECV_COMPLETION=1, NCCL_IB_USE_INLINE=1, RCCL_GDR_FLUSH_GPU_MEM_NO_RELAXED_ORDERING=0,
    # NCCL_GDR_FLUSH_DISABLE=1, NCCL_IGNORE_CPU_AFFINITY=1 and
    # LD_LIBRARY_PATH=/opt/amd-anp/build:/opt/rccl/build/release:/opt/rocm/lib.
    # Mooncake PD moves the KV cache over network.rdmaDevices, the RDMA NICs every node of a cluster has, e.g.
    # rdmaDevices: {<cluster>: [rdma0, rdma1]}; the wizard offers PD only on clusters listed there.
    network: {}
    evaluation:
      inference:
        image: fromImages
        command: "python3 -m sglang.launch_server --model-path {model} --served-model-name {name} --tp {tp} --host 0.0.0.0 --port 8000"
        port: 8000
        readinessPath: /v1/models
        maxWaitSeconds: 7200
      probes:
        - {prompt: "What is the capital of France? Answer with one word.", expect: exact, answer: Paris}
        - {prompt: "Write a Triton kernel that adds two vectors.", expect: pythonCode}
    # Mounted-path imports of Spur run directories: per cluster, the workspace whose pods see Spur's /shared_nfs
    # read-only at root (a ReadOnlyMany volume mounted there), where the scan jobs run, e.g.
    # {cluster: <cluster>, workspace: spur-import, root: /shared_nfs}. The mount is a storage and network change
    # approved on its own; until then the dialog offers only the command upload.
    imports:
      mounts: []
# Save Image: where a cluster's saved workload images go. A cluster without an entry uses
# the default registry. Each entry:
#   cluster: <cluster id>
#   registry: registry the saved image is published in (default: the default registry).
#     The cluster's containers upload their changes to it directly, so they must reach it
#     (see host_aliases), and it must hold the images they were started from.
#   target_project: project of the saved images (default: custom)
#   staging_project: private project, one repository per export (default: save-staging).
#     It only ever holds layer blobs. Harbor records a repository only when a manifest is
#     pushed, so these have none to delete, and retention policies (which select
#     artifacts) do not apply; the layer of a saved image lives on in the image it was
#     mounted into, and the layer of an export that failed is referenced by nothing.
#     Harbor's garbage collection deletes such blobs once they are older than its time
#     window (2 hours by default): schedule it (Administration > Clean Up), or they
#     accumulate. Another registry needs its own garbage collection for the same reason.
#   ca_secret: <namespace>/<name> of a Secret whose ca.crt signs the registry, trusted on
#     top of the container's system roots (default: the built-in Harbor's CA when the
#     registry is the built-in Harbor; none otherwise)
#   staging_push_secret: <namespace>/<name> of a Docker config Secret for an account that can
#     push to staging_project alone (e.g. a Harbor robot account of that project). The
#     container's upload token is minted with it; Harbor gives a token the power of the
#     account that minted it, so it must never be an administrator.
#     (default: primus-safe/primus-safe-save-image-staging-cred, which the apiserver creates
#     with save-staging and its robot account in the built-in Harbor; saving is refused
#     without it)
#   host_aliases: [{ip: ..., hostnames: [...]}] added to every Pod of the cluster
# Saving needs a record of the files a container started with, which can only be made when
# it starts, so every container's launcher makes it, in the background at the lowest CPU
# and I/O priority, without delaying the entry point. Measured on a root file system of
# 905k paths: 6.8 s, about 7 CPU-seconds on one core, 98 MB written to the Pod's shared
# volume, 10 MiB of memory. A workload that sets SAFE_SAVE_IMAGE_RECORD=0 in its
# environment skips it, and saving it is then refused with that reason.
save_image:
  clusters: []

external_execution:
  # Off by default: with it off, external objects are rejected at admission.
  # Enable per site via .env (upgrade.sh / cd-deploy.sh):
  #   external_enable=true
  enabled: false
  # Caps how long a provider observation stays usable once the provider stops reporting.
  observation_max_age_seconds: 120
  # Bounds how long an external workspace goes without a reconcile, so a stale observation
  # is noticed well before the controller's own fifteen minute backstop.
  workspace_resync_seconds: 30
workload:
  # Seconds to keep a finished workload before TTL deletion.
  ttl_second: 60
sandbox:
  enable: true
  namespace: "agent-sandbox-system"
  secret: "envd-router-identity"
  # EnvD injector initContainer image. Repo path only; the template adds harbor.<sub_domain>.<domain>/proxy/,
  # so the digest has to exist on Docker Hub. Must include GET /api/jobs for Brain idle sandbox reclaim.
  envd_injector_image: "primussafe/agent-sandbox-envd-injector@sha256:caa09fc544d4bcfb0e946c5a1371a63f5a27c128d166330544b44f8f55fd4d1c"
  # Secret holding extra CA certificates (PEM, any key name) that sandboxes must trust. Create it in the
  # primus-safe namespace with the annotations
  #   primus-safe.workspace.selector: "primus-safe.workspace.scope.sandbox=true"
  #   primus-safe.secret.broadcast: "true"
  # (the second marks it as safe to copy into every matching workspace), and resource-manager mirrors
  # it into the namespace of every workspace that accepts Sandbox workloads, including existing ones
  # and ones created later; the label is derived from the workspace's scopes (workspaces not updated
  # since the label existed may lack it on the object; kubectl -l can then disagree, the mirror does
  # not). Only that label may be selected on: others take their value from what whoever creates a
  # workspace submits. A primus-safe.workspace.ids list (JSON array of workspace ids) still works and
  # adds to the selector. A selector that is invalid, or lacks the broadcast annotation, is frozen:
  # nothing new is mirrored and no copy is removed; the reason is in the
  # primus-safe.workspace.selector.error annotation. The copies the selector made are recorded by
  # resource-manager in primus-safe.workspace.selector.applied (an annotation, which caps the scale at
  # about a thousand workspaces); while the selector is frozen they stay and their content stays in
  # sync. If that record is missing or damaged (for example after kubectl replace), every copy is
  # kept as it is, ids removals included, and only the ids list is updated; do not edit or delete the
  # record by hand: fix the selector (resource-manager then rewrites the record) or remove
  # primus-safe.workspace.selector to stop mirroring.
  # Do not roll resource-manager back to a release without the selector: it would drop copies reached
  # only by it; add the workspaces to primus-safe.workspace.ids first. When set, it is mounted at
  # /etc/claw/extra-ca, merged into /shared/bin/ca-bundle.pem, and the sandbox's CA variables point
  # there; a sandbox then refuses to start if no certificate is found. Empty keeps the image's own trust.
  # Set per deploy via `sandbox_extra_ca_secret` (in .env for upgrade.sh, in the environment for install.sh).
  # SECURITY: anyone who can edit a workspace's scopes can make it match this selector, so the only
  # protection is never putting primus-safe.secret.broadcast on a Secret that holds a credential.
  extra_ca_secret: ""
  # Set to sandbox-env (the only accepted name) to give each sandbox's main container every key of
  # the Secret sandbox-env in its workspace namespace as an environment variable (envFrom, optional):
  # a workspace without the Secret starts its sandboxes without them. Values stay in the Secret;
  # neither the Workload nor the Pod spec holds them. Variables the template or the Workload set
  # themselves keep their own value; the template sets no PATH, so a PATH key in the Secret is the
  # sandbox's starting PATH, and the runtime's directories are appended to it. The apiserver and resource-manager reserve the name sandbox-env
  # whether or not this is set (only a system admin, or an admin of every workspace it is bound to,
  # may write it through the SaFE API; the mirror never takes over one already in a workspace
  # namespace), so turning this on opens no window in which a member could take the name. The name
  # is fixed for that reason: a site-chosen one would be guarded only once the apiserver restarted.
  # Empty (the default) renders nothing. Set per deploy via `sandbox_env_secret` (in .env for
  # upgrade.sh, in the environment for install.sh). Only writes from this version on are checked:
  # before turning it on, look for a sandbox-env written earlier (docs/apis/secret.md).
  env_secret: ""
mcp:
  enabled: true
  base_path: "/api/v1/safe-mcp/mcp"
  instructions: "SaFE API Server - GPU Cluster Management Tools via MCP"
  # CORS allowlist for browser-based MCP clients. Empty (default) means
  # same-origin only: no Access-Control-Allow-Origin header is emitted, so
  # cross-origin fetch from arbitrary sites is blocked. Add explicit origins
  # (e.g. "https://safe-ui.example.com") to opt in. Wildcard "*" supported
  # but discouraged.
  allowed_origins: []
